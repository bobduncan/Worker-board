<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="board-token" content="{{token}}">
  <title>Worker board</title>
  <link rel="stylesheet" href="/board.css">
  <script src="/board.js" defer></script>
</head>
<body>
  <nav class="tabs" aria-label="Views">
    <button class="tab is-active" type="button" data-tab="overview">Overview</button>
    <button class="tab" type="button" data-tab="advice">Advice &amp; Chat</button>
    <span class="grow"></span>
    <p class="updated" id="updated">Reading…</p>
    <button class="icon-button" id="refresh" type="button" title="Read again" aria-label="Read again"></button>
  </nav>

  <div class="view" id="view-overview">
    <main class="overview">
      <header class="head">
        <h1>Lava Tactics <button class="icon-button" id="refresh-title" type="button" title="Read again" aria-label="Read again"></button></h1>
        <div class="main-game" id="main-game"></div>
        <div class="counts" id="counts"></div>
      </header>
      <section class="lanes" id="lanes" aria-label="Workers"></section>
      <section class="panel" id="today" aria-labelledby="today-title">
        <h2 id="today-title">Timeline <small id="today-range"></small></h2>
        <div class="today">
          <div class="timeline" id="timeline"></div>
          <ul class="legend" id="legend"></ul>
        </div>
      </section>
      <div id="folders"></div>
    </main>

    <div class="resizer" id="inbox-resizer" role="separator" aria-orientation="vertical" aria-label="Width of For you" tabindex="0" title="Drag to make For you wider or narrower; double-click for the usual width"></div>
    <aside class="inbox" aria-labelledby="inbox-title">
      <header class="inbox-top">
        <h2 id="inbox-title">For you <span class="count" id="needs-count"></span></h2>
        <label class="check" title="Also show what you answered here and the steps that are ticked in the backlog">
          <input type="checkbox" id="needs-closed"> Show closed
        </label>
        <select id="needs-order" aria-label="Order">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="worker">By worker</option>
        </select>
      </header>
      <div class="needs" id="needs"></div>
    </aside>
  </div>

  <div class="view" id="view-advice" hidden>
    <section class="panel advice-panel" aria-labelledby="advice-title">
      <h2 id="advice-title">Advice</h2>
      <div class="advice" id="advice-text"></div>
    </section>
    <div class="resizer" id="talk-resizer" role="separator" aria-orientation="vertical" aria-label="Width of the chat" tabindex="0" title="Drag to make the chat wider or narrower; double-click for the usual width"></div>
    <aside class="talk" aria-labelledby="talk-title">
      <header class="talk-top">
        <h2 id="talk-title">Advisor</h2>
        <span id="talk-state"></span>
      </header>
      <div class="messages" id="messages"></div>
      <form class="say" id="say">
        <textarea id="say-text" rows="2" placeholder="Ask the advisor…" maxlength="2000" aria-label="Message to the advisor"></textarea>
        <button type="submit" id="say-send">Send</button>
      </form>
      <p class="muted say-note" id="say-note"></p>
    </aside>
  </div>

  <dialog class="details" id="details" aria-label="Details"></dialog>

  <dialog class="lightbox" id="lightbox" aria-label="Picture">
    <figure>
      <img id="lightbox-picture" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </dialog>
</body>
</html>
